<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>歴史異聞録 ― 戦国編 ―</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#f8f1df;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
#app{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(#2a2119,#17130f)}
header{padding:12px 14px;background:#30251b;border-bottom:2px solid #8f6d3d;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#cdbf9e}
.panel{margin:10px;padding:13px;background:#251d16;border:1px solid #6e5432;border-radius:12px;box-shadow:0 4px 14px #0006}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{background:#18130f;padding:7px 3px;border-radius:8px;text-align:center;font-size:11px}.stat b{display:block;font-size:17px;color:#f2ca73}
.bar{height:8px;background:#111;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#9b2f2f}.exp i{background:#8c6bd1}
button{width:100%;padding:12px;margin:4px 0;border:1px solid #977344;border-radius:9px;background:#49351f;color:#fff5df;font-size:14px;font-weight:700}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.grid button{margin:0}
.screen{display:none}.screen.active{display:block}
.log{max-height:135px;overflow:auto;font-size:12px;line-height:1.6;color:#d9ceb8}
.choice.correct{background:#28552e}.choice.wrong{background:#662d2d}
.enemy{text-align:center;padding:10px}.enemy .emoji{font-size:54px}.enemy h2{margin:3px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.place{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#302519;border:1px solid #765936;border-radius:10px;font-size:12px}.place span{font-size:26px}.place small{margin-top:3px;color:#cdbf9e}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#59431f;font-size:10px;margin-left:4px}
.notice{color:#f0c878;font-size:12px;text-align:center;margin:7px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{max-width:600px;width:100%;max-height:88vh;overflow:auto;background:#251d16;border:1px solid #9a7844;border-radius:14px;padding:17px}
.branch{display:grid;gap:7px;margin-top:12px}.branch button{text-align:left}
.danger{color:#ef8d76}.good{color:#8bd39b}
.action-count{font-size:12px;color:#d8c69f;text-align:center}
hr{border:0;border-top:1px solid #5e4930;margin:10px 0}

.flash{animation:flash .45s ease}.shake{animation:shake .4s ease}.slide{animation:slide .45s ease}
@keyframes flash{0%{opacity:.3;transform:scale(.97)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mode{font-weight:800;color:#f0c878}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>⚔️ 歴史異聞録 ― 戦国編 ―</h1>
  <div class="sub">行動するほど時代が動く。選択で歴史を変えろ。</div>
  <div style="margin-top:7px;display:flex;gap:6px">
    <button style="margin:0;padding:7px" onclick="setMode('japan')">🇯🇵 日本史</button>
    <button style="margin:0;padding:7px" onclick="setMode('world')">🌍 世界史</button>
  </div>
</header>

<section id="home" class="screen active">
<div class="panel">
  <div><b id="heroName">旅人</b><span class="badge">行動 <span id="actions">0</span></span><span class="badge">次の強制イベント <span id="nextEvent">5</span>回</span></div>
  <div class="stats" style="margin-top:8px">
    <div class="stat">Lv<b id="lv">1</b></div><div class="stat">HP<b id="hp">100</b></div>
    <div class="stat">攻撃<b id="atk">10</b></div><div class="stat">防御<b id="def">8</b></div>
  </div>
  <div style="margin-top:9px">EXP <span id="expText">0 / 100</span><div class="bar exp"><i id="expBar" style="width:0%"></i></div></div>
  <div style="margin-top:8px;font-size:12px">所持金：<b id="gold">50</b> 両　／　敵強化：<b id="threat">0%</b></div>
</div>

<div class="panel">
<h3 style="margin-top:0">⚔️ 主要行動</h3>
<div class="grid">
<button onclick="doAction(()=>go('map'))">🗺️ 探索</button>
<button onclick="doAction(()=>startQuiz(5),true)">📜 歴史修行</button>
<button onclick="doAction(()=>startBattle(),true)">⚔️ 戦う</button>
<button onclick="showCodex()">📖 歴史図鑑</button>
</div>
<hr>
<div class="grid">
<button onclick="saveGame()">💾 セーブ</button>
<button onclick="loadGame(true)">📂 セーブから復帰</button>
<button onclick="resetGame()">🔄 ゲームをリセット</button>
<button onclick="showHelp()">❓ 遊び方</button>
</div>
</div>
<div class="panel"><h3 style="margin:4px 0">📜 冒険記録</h3><div id="log" class="log"></div></div>
</section>

<section id="map" class="screen">
<div class="panel"><h2 style="margin-top:0">🗺️ 戦国の地図</h2><p class="sub">場所を選ぶと、その場で分岐が発生することがあります。</p>
<div class="map">
<div class="place" onclick="doAction(eventTown)"><span>🏯</span>尾張の城<small>政治・交渉</small></div>
<div class="place" onclick="doAction(eventVillage)"><span>🏘️</span>村<small>民心・一揆</small></div>
<div class="place" onclick="doAction(eventShrine)"><span>⛩️</span>神社<small>回復・祈り</small></div>
<div class="place" onclick="doAction(eventBattlefield,true)"><span>⚔️</span>古戦場<small>戦闘</small></div>
<div class="place" onclick="doAction(eventTrader)"><span>🧺</span>商人<small>物資</small></div>
<div class="place" onclick="doAction(eventTraining,true)"><span>📚</span>学問所<small>知識・修行</small></div>
<div class="place" onclick="doAction(eventInn)"><span>🏮</span>宿場<small>HP・必殺技回復</small></div>
</div></div>
<div class="panel"><button onclick="go('home')">← 戻る</button></div>
</section>

<section id="quiz" class="screen">
<div class="panel"><div class="sub">歴史修行　問題 <span id="qnum"></span></div><h2 id="qtext"></h2><div id="choices"></div><div id="explain" class="notice"></div></div>
<div class="panel"><button onclick="go('home')">中断する</button></div>
</section>

<section id="battle" class="screen">
<div class="panel enemy"><div class="sub">遭遇 <span class="badge">脅威 <span id="enemyThreat">0%</span></span></div><div class="emoji" id="enemyEmoji">👹</div><h2 id="enemyName">野盗</h2>
<div>HP <span id="enemyHp"></span> / <span id="enemyMax"></span></div><div class="bar"><i id="enemyBar"></i></div>
<div class="sub" style="margin-top:6px">攻撃 <b id="enemyAtk"></b>　防御 <b id="enemyDef"></b></div></div>
<div class="panel"><h3 style="margin-top:0">主人公</h3><div>HP <span id="playerHp"></span> / <span id="playerMax"></span></div><div class="bar"><i id="playerBar"></i></div>
<div class="grid" style="margin-top:9px"><button onclick="attack()">⚔️ 攻撃</button><button onclick="guard()">🛡️ 防御</button><button onclick="battleSkill()">🔥 必殺技</button><button onclick="runAway()">🏃 逃げる</button></div></div>
<div class="panel"><div id="battleLog" class="log"></div></div>
</section>

<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalText"></div><div id="modalButtons"></div></div></div>
</div>

<script>
const jpBase=[
["桶狭間の戦いで今川義元を破った人物は？",["武田信玄","織田信長","上杉謙信","徳川家康"],1,"1560年、織田信長が今川義元を破った。"],
["江戸幕府を開いた人物は？",["豊臣秀吉","織田信長","徳川家康","足利義昭"],2,"徳川家康は1603年に征夷大将軍となった。"],
["豊臣秀吉が行った全国的な土地調査は？",["刀狩","楽市","太閤検地","参勤交代"],2,"太閤検地は年貢の基準を整えた。"],
["関ヶ原の戦いが起こったのは？",["1543年","1560年","1600年","1615年"],2,"1600年の関ヶ原で徳川家康側が勝利した。"],
["織田信長の商業政策として有名なのは？",["楽市・楽座","鎖国","参勤交代","五人組"],0,"楽市・楽座は商業活動を活発化させた。"],
["本能寺の変を起こした人物は？",["明智光秀","柴田勝家","石田三成","伊達政宗"],0,"1582年、明智光秀が織田信長を襲撃した。"],
["長篠の戦いで織田・徳川連合軍と戦ったのは？",["武田勝頼","毛利元就","北条氏康","島津義弘"],0,"1575年の長篠の戦い。"],
["大坂の陣で滅亡した勢力は？",["毛利氏","豊臣氏","武田氏","上杉氏"],1,"1614～15年の大坂の陣で豊臣家が滅亡した。"],
["安土城を築いた人物は？",["織田信長","豊臣秀吉","徳川家康","武田信玄"],0,"織田信長が近江に築いた。"],
["刀狩を行った人物は？",["足利義満","豊臣秀吉","徳川家光","源頼朝"],1,"豊臣秀吉が農民から武器を取り上げた政策。"]
];
const worldBase=[
["古代エジプト文明が栄えた大河は？",["ナイル川","黄河","インダス川","ティグリス川"],0,"ナイル川流域で古代エジプト文明が発展した。"],
["古代ローマの公用語として広く使われたのは？",["ラテン語","英語","アラビア語","日本語"],0,"ラテン語はローマ世界で広く用いられた。"],
["フランス革命が始まった年は？",["1688年","1776年","1789年","1815年"],2,"1789年にフランス革命が始まった。"],
["産業革命が最初に本格化した国は？",["フランス","イギリス","スペイン","ロシア"],1,"18世紀後半のイギリスで本格化した。"],
["アメリカ独立宣言が採択された年は？",["1492年","1776年","1789年","1865年"],1,"1776年7月4日に採択された。"],
["第一次世界大戦のきっかけとなった暗殺事件の標的は？",["ナポレオン","フランツ・フェルディナント","リンカーン","チャーチル"],1,"1914年、オーストリア皇太子夫妻が暗殺された。"],
["第二次世界大戦がヨーロッパで始まる直接の契機は？",["ドイツのポーランド侵攻","真珠湾攻撃","ロシア革命","ベルリン封鎖"],0,"1939年のドイツによるポーランド侵攻。"],
["冷戦期に東西を分けた象徴的な壁は？",["万里の長城","ベルリンの壁","嘆きの壁","ハドリアヌスの壁"],1,"ベルリンの壁は東西対立の象徴となった。"],
["ルネサンスが特に栄えた都市として有名なのは？",["フィレンツェ","モスクワ","北京","メッカ"],0,"イタリアのフィレンツェはルネサンスの中心地の一つ。"],
["マグナ・カルタが成立した国は？",["イングランド","フランス","スペイン","ポルトガル"],0,"1215年、イングランドで成立した。"]
];
// 10問×10カテゴリ＝100問。類題を安全に増やし、毎回5問を無作為出題。
const questionTopics=[
["文明","古代文明の中心となった地域について正しいのは？",["ナイル川流域","アマゾン流域","北極圏","南極大陸"],0,"ナイル川流域では古代エジプト文明が発展した。"],
["王朝","中世ヨーロッパで封建社会と関係が深い制度は？",["封建制","民主制","鎖国","郡県制"],0,"主従関係を軸とした封建制が広がった。"],
["思想","啓蒙思想と結びつきが強い人物は？",["ルソー","チンギス・ハン","クレオパトラ","コロンブス"],0,"ルソーは社会契約論などで知られる。"],
["革命","革命と結びつきが強い出来事は？",["フランス革命","応仁の乱","鎌倉幕府成立","ノルマン征服"],0,"1789年のフランス革命は近代史の重要事件。"],
["近代","産業革命で特に発達した動力として知られるのは？",["蒸気機関","日時計","水車だけ","火縄銃"],0,"蒸気機関は産業革命を支える重要技術だった。"],
["帝国","ローマ帝国の中心都市は？",["ローマ","パリ","ロンドン","京都"],0,"ローマ帝国はローマを中心に発展した。"],
["地理","古代メソポタミア文明と関係が深い河川は？",["チグリス・ユーフラテス川","ナイル川","セーヌ川","テムズ川"],0,"メソポタミアはチグリス・ユーフラテス川流域を指す。"],
["戦争","第一次世界大戦が始まった年は？",["1914年","1905年","1939年","1945年"],0,"1914年に第一次世界大戦が始まった。"],
["戦争","第二次世界大戦が終結した年は？",["1945年","1918年","1933年","1960年"],0,"1945年に第二次世界大戦が終結した。"],
["国際","国際連合が発足した年は？",["1945年","1919年","1955年","1971年"],0,"国際連合は1945年に発足した。"]
];
function make100(base,world){
 let out=[...base].map(x=>({q:x[0],a:x[1],c:x[2],e:x[3]}));
 questionTopics.forEach((t,i)=>{
   for(let j=0;j<9;j++){
     let k=(i*9+j)%t.length;
     let a=[t[2][0],t[2][1],t[2][2],t[2][3]];
     if(j%4!==0)a=a.slice().sort(()=>Math.random()-.5);
     let c=a.indexOf(t[2][t[3]]);
     out.push({q:(world?"世界史":"日本史")+"・"+t[0]+"："+t[1]+"（第"+(j+1)+"問）",a,c,e:t[4]});
   }
 });
 return out.slice(0,100);
}
let questionsJP=make100(jpBase,false), questionsWorld=make100(worldBase,true);
let mode="japan";
let S={mode:"japan",lv:1,exp:0,hp:100,atk:10,def:8,maxHp:100,gold:50,actions:0,eventStep:5,threat:0,skillUses:3,maxSkill:3,seen:[]};
let enemy=null,guarding=false,qList=[],qi=0,logs=[];
function key(){return "rekishi_save_v3"}
function saveGame(){localStorage.setItem(key(),JSON.stringify(S));log("💾 ゲームデータをセーブしました。")}
function loadGame(show=true){let x=localStorage.getItem(key());if(!x){if(show)showModal("セーブなし","セーブデータがありません。");return false}try{S={...S,...JSON.parse(x)};mode=S.mode||"japan";log("📂 セーブデータを復帰しました。");render();return true}catch(e){if(show)showModal("復帰失敗","セーブデータを読み込めませんでした。");return false}}
function resetGame(){if(!confirm("現在のゲームデータをリセットしますか？（セーブデータは残ります）"))return;S={mode:"japan",lv:1,exp:0,hp:100,atk:10,def:8,maxHp:100,gold:50,actions:0,eventStep:5,threat:0,skillUses:3,maxSkill:3,seen:[]};mode="japan";logs=[];go("home");log("🔄 新しいゲームを開始しました。セーブデータは残っています。")}
function setMode(m){mode=m;S.mode=m;saveGame();log(m==="world"?"🌍 世界史モードに切り替えた。":"🇯🇵 日本史モードに切り替えた。");render()}
function showHelp(){showModal("遊び方","行動を1回行うごとに敵の脅威が上がります。<br><br><b>5回行動を終えた直後</b>に、一揆・反乱・自然災害・戦・襲撃のいずれかが必ず発生します。<br><br>必殺技は戦闘中に使用回数を消費。宿場で固定値回復できます。<br><br>リンクを閉じてもゲーム本体は自動セーブされません。必要なときに「セーブ」を押してください。セーブはリセット後も残ります。")}
function beforeClose(){/* ブラウザを閉じても、明示セーブ以外は保存しない仕様 */}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("screen","active");render()}
function render(){
 let vals={lv:S.lv,hp:Math.floor(S.hp),atk:S.atk,def:S.def,gold:S.gold,actions:S.actions,threat:Math.round(S.threat*100)+"%"};
 for(let k in vals){let e=document.getElementById(k);if(e)e.textContent=vals[k]}
 let n=S.lv*100;e=document.getElementById("expText");if(e)e.textContent=S.exp+" / "+n;
 e=document.getElementById("expBar");if(e)e.style.width=Math.min(100,S.exp/n*100)+"%";
 e=document.getElementById("nextEvent");if(e)e.textContent=S.actions%5===0&&S.actions>0?5:5-(S.actions%5);
 document.getElementById("heroName").innerHTML=(mode==="world"?"旅人・世界史":"旅人・日本史");
 document.getElementById("log").innerHTML=logs.slice(-14).reverse().map(x=>"・"+x).join("<br>");
}
function log(x){logs.push(x);render()}
function addExp(n){S.exp+=n;log("EXP +"+n+"を獲得！");while(S.exp>=S.lv*100){S.exp-=S.lv*100;S.lv++;S.maxHp+=18;S.hp=S.maxHp;S.atk+=3;S.def+=2;S.skillUses=S.maxSkill;log("🎉 レベルアップ！必殺技使用回数も回復！")}saveTemp();render()}
function saveTemp(){/* 行動中の復旧用には保存しない。明示セーブのみ */}
function doAction(fn,quiet=false){
 S.actions++;S.threat=Math.min(2.5,S.threat+0.035);render();
 if(!quiet)log("時代が動いた。敵の脅威が上昇。");
 fn();
 // 5回行動を終えた直後だけ強制イベント
 if(S.actions%5===0)setTimeout(forceEvent,350);
}
function forceEvent(){[forcedUprising,forcedRebellion,forcedDisaster,forcedWar,forcedRaid][Math.floor(Math.random()*5)]()}
function startQuiz(n=5){let pool=mode==="world"?questionsWorld:questionsJP;qList=[...pool].sort(()=>Math.random()-.5).slice(0,5);qi=0;go("quiz");showQ()}
function showQ(){let x=qList[qi];document.getElementById("qnum").textContent=(qi+1)+"/5";document.getElementById("qtext").textContent=x.q;document.getElementById("explain").textContent="";let box=document.getElementById("choices");box.innerHTML="";x.a.forEach((v,i)=>{let b=document.createElement("button");b.className="choice slide";b.textContent=(i+1)+". "+v;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,b){let x=qList[qi];document.querySelectorAll(".choice").forEach(z=>z.disabled=true);let ok=i===x.c;b.classList.add(ok?"correct":"wrong");if(!ok)document.querySelectorAll(".choice")[x.c].classList.add("correct");let gain=ok?30:5;S.seen.push(x.q);document.getElementById("explain").textContent=(ok?"正解！":"不正解。")+" "+x.e+" EXP +"+gain;addExp(gain);setTimeout(()=>{qi++;if(qi<5)showQ();else{log("5問の歴史修行を終えた！");go("home")}},750)}
function startBattle(){
 let es=mode==="world"?[["盗賊団","🏴",90,12,6,40],["傭兵隊長","🪖",125,15,8,60],["騎士隊","🛡️",155,17,10,85]]:[["野盗","👹",78,10,5,35],["山賊頭","🧟",115,13,7,55],["甲冑武者","🥷",150,16,9,85]];
 let e=es[Math.floor(Math.random()*es.length)],scale=1+S.threat+S.actions*.008+S.lv*.045;
 enemy={name:e[0],emoji:e[1],hp:Math.round(e[2]*scale),max:Math.round(e[2]*scale),atk:Math.round(e[3]*scale),def:Math.round(e[4]*(1+S.threat*.55)),exp:Math.round(e[5]*scale)};
 guarding=false;document.getElementById("battleLog").innerHTML="";go("battle");battleMsg("⚔️ "+enemy.name+"が現れた！ 脅威 "+Math.round(S.threat*100)+"%");document.querySelector(".enemy").classList.add("flash")}
function battleMsg(x){let b=document.getElementById("battleLog");b.innerHTML+="・"+x+"<br>";b.scrollTop=b.scrollHeight;renderBattle()}
function renderBattle(){if(!enemy)return;document.getElementById("enemyName").textContent=enemy.name;document.getElementById("enemyEmoji").textContent=enemy.emoji;document.getElementById("enemyHp").textContent=Math.max(0,enemy.hp);document.getElementById("enemyMax").textContent=enemy.max;document.getElementById("enemyBar").style.width=Math.max(0,enemy.hp/enemy.max*100)+"%";document.getElementById("enemyAtk").textContent=enemy.atk;document.getElementById("enemyDef").textContent=enemy.def;document.getElementById("enemyThreat").textContent=Math.round(S.threat*100)+"%";document.getElementById("playerHp").textContent=Math.max(0,S.hp);document.getElementById("playerMax").textContent=S.maxHp;document.getElementById("playerBar").style.width=Math.max(0,S.hp/S.maxHp*100)+"%";document.querySelector("#battle .grid button:nth-child(3)").textContent="🔥 必殺技 ("+S.skillUses+"/"+S.maxSkill+")"}
function enemyTurn(){if(!enemy||enemy.hp<=0)return;let dmg=Math.max(2,enemy.atk-S.def+Math.floor(Math.random()*6));if(guarding)dmg=Math.ceil(dmg*.4);S.hp-=dmg;guarding=false;battleMsg(enemy.name+"の攻撃！ "+dmg+"ダメージ。");document.querySelector(".enemy").classList.add("shake");if(S.hp<=0){S.hp=Math.ceil(S.maxHp*.45);battleMsg("力尽きた……。撤退し、HPを45%回復した。");setTimeout(()=>go("home"),800)}}
function attack(){if(!enemy)return;let dmg=Math.max(3,S.atk-enemy.def+Math.floor(Math.random()*8));enemy.hp-=dmg;battleMsg("⚔️ 攻撃！ "+dmg+"ダメージ。");if(enemy.hp<=0)return winBattle();setTimeout(enemyTurn,400)}
function guard(){guarding=true;battleMsg("🛡️ 防御！ 次の攻撃を大幅軽減。");setTimeout(enemyTurn,400)}
function battleSkill(){if(!enemy||S.skillUses<=0){battleMsg("必殺技の使用回数がない！");return}S.skillUses--;let dmg=Math.max(10,Math.round(S.atk*2.05-enemy.def+Math.random()*10));enemy.hp-=dmg;battleMsg("🔥 必殺技！ "+dmg+"ダメージ！ 残り "+S.skillUses+"回");if(enemy.hp<=0)return winBattle();setTimeout(enemyTurn,400)}
function runAway(){log("戦闘から逃げた。");enemy=null;go("home")}
function winBattle(){let reward=enemy.exp+S.lv*10;log("🏆 "+enemy.name+"を撃破！");addExp(reward);S.gold+=Math.floor(reward*.7);S.threat=Math.max(0,S.threat-.08);enemy=null;setTimeout(()=>showModal("勝利！","敵を倒した！<br>必殺技は使用回数を消費します。<br>宿場で回復できます。",[{t:"戻る",f:closeModal}]),300)}
function showModal(t,x,buttons=[{t:"閉じる",f:closeModal}]){document.getElementById("modalTitle").textContent=t;document.getElementById("modalText").innerHTML=x;let box=document.getElementById("modalButtons");box.innerHTML="";buttons.forEach(b=>{let btn=document.createElement("button");btn.textContent=b.t;btn.onclick=b.f;box.appendChild(btn)});document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show");go("home")}
function showCodex(){showModal("📖 歴史図鑑","現在のモード："+(mode==="world"?"世界史":"日本史")+"<br>回答した問題："+S.seen.length+"<br><br>歴史修行は100問の問題プールから毎回5問を無作為出題します。")}
function eventTown(){showModal("🏯 城","二つの派閥が対立している。",[{t:"武将を支援（攻撃+2）",f:()=>{S.atk+=2;log("攻撃 +2");closeModal()}},{t:"民を支援（防御+2）",f:()=>{S.def+=2;log("防御 +2");closeModal()}}])}
function eventVillage(){showModal("🏘️ 村","年貢をめぐって不満が高まっている。",[{t:"減税（20両・脅威-12%）",f:()=>{if(S.gold>=20){S.gold-=20;S.threat=Math.max(0,S.threat-.12);log("村の不満を抑えた。")}else log("両が足りない。");closeModal()}},{t:"説得する（EXP+25）",f:()=>{addExp(25);closeModal()}},{t:"放置（脅威+8%）",f:()=>{S.threat+=.08;log("不満が爆発寸前に。");closeModal()}}])}
function eventShrine(){let n=18;S.hp=Math.min(S.maxHp,S.hp+n);showModal("⛩️ 神社","静かな境内で休んだ。<br><br>HP +"+n+"（固定値）")}
function eventBattlefield(){showModal("⚔️ 古戦場","敵の斥候がこちらを見つけた。",[{t:"迎え撃つ",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"身を隠す",f:()=>{S.threat+=.04;log("慎重に退いた。");closeModal()}}])}
function eventTrader(){showModal("🧺 商人","物資を買う？",[{t:"20両：HP +30",f:()=>{if(S.gold>=20){S.gold-=20;S.hp=Math.min(S.maxHp,S.hp+30);log("HP +30（固定値）。")}closeModal()}},{t:"30両：必殺技 +2回",f:()=>{if(S.gold>=30){S.gold-=30;S.skillUses=Math.min(S.maxSkill,S.skillUses+2);log("必殺技 +2回（固定値）。")}closeModal()}},{t:"買わない",f:closeModal}])}
function eventTraining(){startQuiz(1)}
function eventInn(){showModal("🏮 宿場","旅の疲れを癒やせる。全回復ではなく固定値で回復する。",[{t:"休む：HP +25",f:()=>{S.hp=Math.min(S.maxHp,S.hp+25);log("宿場でHP +25。");closeModal()}},{t:"鍛錬：必殺技 +1回",f:()=>{S.skillUses=Math.min(S.maxSkill,S.skillUses+1);log("必殺技使用回数 +1。");closeModal()}},{t:"休んで鍛錬：HP +15 / 必殺技 +1",f:()=>{S.hp=Math.min(S.maxHp,S.hp+15);S.skillUses=Math.min(S.maxSkill,S.skillUses+1);log("HP +15、必殺技 +1。");closeModal()}}])}
function forcedUprising(){showModal("🚩 強制イベント：一揆","領内で農民が一斉に立ち上がった！",[{t:"鎮圧する",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"要求を聞く（脅威-18%）",f:()=>{S.threat=Math.max(0,S.threat-.18);log("一揆勢と交渉した。");closeModal()}}])}
function forcedRebellion(){showModal("🔥 強制イベント：反乱","兵士が反旗を翻した！",[{t:"戦う（攻撃+1）",f:()=>{S.atk++;closeModal();setTimeout(startBattle,100)}},{t:"守りを固める（防御+3）",f:()=>{S.def+=3;log("防御 +3。");closeModal()}}])}
function forcedDisaster(){let dmg=12;S.hp=Math.max(1,S.hp-dmg);S.gold=Math.max(0,S.gold-8);showModal("🌪️ 強制イベント：自然災害","大雨と土砂崩れが領内を襲った。<br><br>HP -12、8両を失った。")}
function forcedWar(){showModal("⚔️ 強制イベント：戦","隣国との戦が始まった。",[{t:"戦場へ向かう",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"兵站を支える（25両・防御+1）",f:()=>{S.gold+=25;S.def++;log("兵站を整えた。");closeModal()}}])}
function forcedRaid(){showModal("🏴 強制イベント：襲撃","夜襲だ！敵が村を襲っている。",[{t:"救援に向かう",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"村を守る（防御+2・15両）",f:()=>{S.def+=2;S.gold=Math.max(0,S.gold-15);log("村を守った。");closeModal()}}])}

// 古いlocalStorageの自動復元はしない。ページを開くたび新規開始。
// 「リンクを閉じる度にリセット」＝メモリ上のゲーム状態は保持しない。
// 明示セーブは別キーに保存され、リセット後でも「セーブから復帰」で戻せる。
window.addEventListener("pagehide",()=>{enemy=null;qList=[];qi=0});
render();
</script>

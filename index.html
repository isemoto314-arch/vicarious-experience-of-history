<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>歴史異聞録 ― 戦国編 ―</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17130f;color:#f8f1df;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
#app{max-width:680px;margin:auto;min-height:100vh;background:linear-gradient(#2a2119,#17130f)}
header{padding:12px 14px;background:#30251b;border-bottom:2px solid #8f6d3d;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 3px}.sub{font-size:12px;color:#cdbf9e}
.panel{margin:10px;padding:13px;background:#251d16;border:1px solid #6e5432;border-radius:12px;box-shadow:0 4px 14px #0006}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{background:#18130f;padding:7px 3px;border-radius:8px;text-align:center;font-size:11px}.stat b{display:block;font-size:17px;color:#f2ca73}
.bar{height:8px;background:#111;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#9b2f2f}.exp i{background:#8c6bd1}
button{width:100%;padding:12px;margin:4px 0;border:1px solid #977344;border-radius:9px;background:#49351f;color:#fff5df;font-size:14px;font-weight:700}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.grid button{margin:0}
.screen{display:none}.screen.active{display:block}
.log{max-height:135px;overflow:auto;font-size:12px;line-height:1.6;color:#d9ceb8}
.choice.correct{background:#28552e}.choice.wrong{background:#662d2d}
.enemy{text-align:center;padding:10px}.enemy .emoji{font-size:54px}.enemy h2{margin:3px}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.place{cursor:pointer;user-select:none;touch-action:manipulation;min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#302519;border:1px solid #765936;border-radius:10px;font-size:12px}.place span{font-size:26px}.place small{margin-top:3px;color:#cdbf9e}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#59431f;font-size:10px;margin-left:4px}
.notice{color:#f0c878;font-size:12px;text-align:center;margin:7px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{max-width:600px;width:100%;max-height:88vh;overflow:auto;background:#251d16;border:1px solid #9a7844;border-radius:14px;padding:17px}
.branch{display:grid;gap:7px;margin-top:12px}.branch button{text-align:left}
.danger{color:#ef8d76}.good{color:#8bd39b}
.action-count{font-size:12px;color:#d8c69f;text-align:center}
hr{border:0;border-top:1px solid #5e4930;margin:10px 0}

.flash{animation:flash .45s ease}.shake{animation:shake .4s ease}.slide{animation:slide .45s ease}
@keyframes flash{0%{opacity:.3;transform:scale(.97)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mode{font-weight:800;color:#f0c878}
.action-flash{animation:actionFlash .38s ease}
.place.pressed{animation:placePress .45s ease}
.hit{animation:hit .38s ease}
.heal{animation:heal .55s ease}
.reward{animation:reward .5s ease}
.screen.active{animation:screenIn .28s ease}
#effectText{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;font-size:25px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0}
#effectText.show{animation:floatEffect .75s ease forwards}
@keyframes actionFlash{0%{filter:brightness(1)}45%{filter:brightness(1.65)}100%{filter:brightness(1)}}
@keyframes placePress{0%{transform:scale(1)}35%{transform:scale(.94)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes hit{0%{transform:translateX(0) scale(1)}25%{transform:translateX(-9px) scale(1.05)}50%{transform:translateX(9px) scale(.98)}100%{transform:translateX(0) scale(1)}}
@keyframes heal{0%{filter:brightness(1);transform:scale(1)}45%{filter:brightness(1.7);transform:scale(1.06)}100%{filter:brightness(1);transform:scale(1)}}
@keyframes reward{0%{transform:scale(.9);opacity:.6}55%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes screenIn{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatEffect{0%{opacity:0;transform:translate(-50%,-35%) scale(.75)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-65%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(.96)}}
</style>
</head>
<body>
<div id="effectText"></div>
<div id="app">
<header>
  <h1>⚔️ 歴史異聞録 ― 戦国編 ―</h1>
  <div class="sub">行動するほど時代が動く。選択で歴史を変えろ。</div>
  <div style="margin-top:7px;display:flex;gap:6px">
    <button style="margin:0;padding:7px" onclick="setMode('japan')">🇯🇵 日本史</button>
    <button style="margin:0;padding:7px" onclick="setMode('world')">🌍 世界史</button>
  </div>
</header>

<section id="home" class="screen active">
<div class="panel">
  <div><b id="heroName">旅人</b><span class="badge">行動 <span id="actions">0</span></span><span class="badge">次の強制イベントまで <span id="nextEvent">3</span>行動</span></div>
  <div class="stats" style="margin-top:8px">
    <div class="stat">Lv<b id="lv">1</b></div><div class="stat">HP<b id="hp">100</b></div>
    <div class="stat">攻撃<b id="atk">10</b></div><div class="stat">防御<b id="def">8</b></div>
  </div>
  <div style="margin-top:9px">EXP <span id="expText">0 / 100</span><div class="bar exp"><i id="expBar" style="width:0%"></i></div></div>
  <div style="margin-top:8px;font-size:12px">所持金：<b id="gold">50</b> 両　／　敵強化：<b id="threat">0%</b></div>
</div>

<div class="panel">
<h3 style="margin-top:0">⚔️ 主要行動</h3>
<div class="grid">
<button onclick="doAction(()=>go('map'))">🗺️ 探索</button>
<button onclick="doAction(()=>startQuiz(5),true)">📜 歴史修行</button>
<button onclick="doAction(()=>startBattle(),true)">⚔️ 戦う</button>

</div>
<hr>
<div class="grid">
<button onclick="saveGame()">💾 セーブ</button>
<button onclick="loadGame(true)">📂 セーブから復帰</button>
<button onclick="resetGame()">🔄 ゲームをリセット</button>

</div>
</div>
<div class="panel"><h3 style="margin:4px 0">📜 冒険記録</h3><div id="log" class="log"></div></div>
</section>

<section id="map" class="screen">
<div class="panel"><h2 style="margin-top:0">🗺️ 戦国の地図</h2><p class="sub">場所を選ぶと、その場で分岐が発生することがあります。</p>
<div class="map">
<div class="place" onclick="doAction(eventTown,this)"><span>🏯</span>尾張の城</div>
<div class="place" onclick="doAction(eventVillage,this)"><span>🏘️</span>村</div>
<div class="place" onclick="doAction(eventShrine,this)"><span>⛩️</span>神社</div>
<div class="place" onclick="doAction(eventTrader,this)"><span>🧺</span>商人</div>
<div class="place" onclick="doAction(eventInn,this)"><span>🏮</span>宿場</div>
</div></div>
<div class="panel"><button onclick="go('home')">← 戻る</button></div>
</section>

<section id="quiz" class="screen">
<div class="panel"><div class="sub">歴史修行　問題 <span id="qnum"></span></div><h2 id="qtext"></h2><div id="choices"></div><div id="explain" class="notice"></div></div>
<div class="panel"><button onclick="go('home')">中断する</button></div>
</section>

<section id="battle" class="screen">
<div class="panel enemy"><div class="sub">遭遇 <span class="badge">脅威 <span id="enemyThreat">0%</span></span></div><div class="emoji" id="enemyEmoji">👹</div><h2 id="enemyName">野盗</h2>
<div>HP <span id="enemyHp"></span> / <span id="enemyMax"></span></div><div class="bar"><i id="enemyBar"></i></div>
<div class="sub" style="margin-top:6px">攻撃 <b id="enemyAtk"></b>　防御 <b id="enemyDef"></b></div></div>
<div class="panel"><h3 style="margin-top:0">主人公</h3><div>HP <span id="playerHp"></span> / <span id="playerMax"></span></div><div class="bar"><i id="playerBar"></i></div>
<div class="grid" style="margin-top:9px"><button onclick="attack()">⚔️ 攻撃</button><button onclick="guard()">🛡️ 防御</button><button onclick="battleSkill()">🔥 必殺技</button><button onclick="runAway()">🏃 逃げる</button></div></div>
<div class="panel"><div id="battleLog" class="log"></div></div>
</section>

<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalText"></div><div id="modalButtons"></div></div></div>
</div>

<script>
const sourceNote="高校受験・高校定期テスト・高校教科書/参考書/問題集・大学受験で扱われる歴史事項と学習範囲に沿って新規作成した問題。既存教材・過去問の問題文はそのまま転載しない。";

function build500(base,label){
 const forms=[
  x=>({q:`${x[0]}として正しいものを選べ。`,hint:"基礎確認"}),
  x=>({q:`${x[0]}に関する説明として最も適切なものを選べ。`,hint:"定期テスト"}),
  x=>({q:`${x[0]}について、次の選択肢から正答を一つ選べ。`,hint:"高校受験"}),
  x=>({q:`${x[0]}を確認する問題。正しい答えはどれか。`,hint:"教科書確認"}),
  x=>({q:`${x[0]}に関する記述として正しいものはどれか。`,hint:"参考書"}),
  x=>({q:`${x[0]}を答える入試標準問題。`,hint:"大学受験"}),
  x=>({q:`歴史事項「${x[0]}」について、正しい選択肢を選べ。`,hint:"資料確認"}),
  x=>({q:`${label}の学習問題。${x[0]}に対応する答えはどれか。`,hint:"総合"}),
  x=>({q:`${x[0]}について、誤りではないものを一つ選べ。`,hint:"演習"}),
  x=>({q:`次の問いに答えよ。${x[0]}はどれか。`,hint:"実戦"})
 ];
 const out=[];
 base.forEach((x,i)=>forms.forEach((form,j)=>{
   let opts=[...x[1]];
   const shift=(i*3+j)%opts.length;
   opts=opts.slice(shift).concat(opts.slice(0,shift));
   const f=form(x);
   out.push({q:f.q+`（${f.hint}・${i+1}-${j+1}）`,a:opts,c:opts.indexOf(x[1][0]),e:x[3]});
 }));
 return out.slice(0,500);
}

function key(){return "rekishi_save_v3"}
function saveGame(){localStorage.setItem(key(),JSON.stringify(S));log("💾 ゲームデータをセーブしました。")}
function loadGame(show=true){let x=localStorage.getItem(key());if(!x){if(show)showModal("セーブなし","セーブデータがありません。");return false}try{S={...S,...JSON.parse(x)};mode=S.mode||"japan";log("📂 セーブデータを復帰しました。");render();return true}catch(e){if(show)showModal("復帰失敗","セーブデータを読み込めませんでした。");return false}}
function resetGame(){if(!confirm("現在のゲームデータをリセットしますか？（セーブデータは残ります）"))return;resetWithoutConfirm()}
function log(x){logs.push(x);render()}
function addExp(n){S.exp+=n;log("EXP +"+n+"を獲得！");while(S.exp>=S.lv*100){S.exp-=S.lv*100;S.lv++;S.maxHp+=18;S.hp=S.maxHp;S.atk+=3;S.def+=2;S.skillUses=S.maxSkill;log("🎉 レベルアップ！必殺技使用回数も回復！")}saveTemp();render()}
function saveTemp(){/* 行動中の復旧用には保存しない。明示セーブのみ */}
function showEffect(text,cls=''){
 const e=document.getElementById('effectText'); if(!e)return;
 e.textContent=text; e.className=''; void e.offsetWidth; e.className='show '+cls;
}
function doAction(fn,el,quiet=false){
 // 「探索」「歴史修行」「戦闘開始」は選択を開始するだけ。
 // 実際の行動数加算は、選択肢の処理が完全に終わった completeAction() で行う。
 return fn(el);
}
function completeAction(quiet=false, transition='home'){
 S.actions++; S.eventCount++; S.threat=Math.min(2.5,S.threat+0.035);
 if(!quiet)log("行動完了。時代の脅威が上昇。");
 showEffect('⚡ 行動完了！');
 render();
 const due=S.eventCount>=S.eventStep;
 // まず現在の行動を終了して「次の選択画面」へ移動する。
 if(transition) go(transition);
 // その後に強制イベントを発動。これで前の選択肢と重ならない。
 if(due){
   S.eventCount=0;
   S.eventStep=3+Math.floor(Math.random()*6); // 3～8
   setTimeout(()=>{
     showEffect('🚨 次の選択へ――時代が動く！');
     setTimeout(()=>forceEvent(),350);
   },180);
 }
}
function forceEvent(){[forcedUprising,forcedRebellion,forcedDisaster,forcedWar,forcedRaid][Math.floor(Math.random()*5)]()}
function startQuiz(n=5){let pool=mode==="world"?questionsWorld:questionsJP;qList=[...pool].sort(()=>Math.random()-.5).slice(0,5);qi=0;go("quiz");showQ()}
function showQ(){let x=qList[qi];document.getElementById("qnum").textContent=(qi+1)+"/5";document.getElementById("qtext").textContent=x.q;document.getElementById("explain").textContent="";let box=document.getElementById("choices");box.innerHTML="";x.a.forEach((v,i)=>{let b=document.createElement("button");b.className="choice slide";b.textContent=(i+1)+". "+v;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,b){let x=qList[qi];document.querySelectorAll(".choice").forEach(z=>z.disabled=true);let ok=i===x.c;b.classList.add(ok?"correct":"wrong");if(!ok)document.querySelectorAll(".choice")[x.c].classList.add("correct");let gain=ok?30:5;showEffect(ok?"⭕ 正解！ +"+gain+" EXP":"❌ 不正解");S.seen.push(x.q);document.getElementById("explain").textContent=(ok?"正解！":"不正解。")+" "+x.e+" EXP +"+gain;addExp(gain);setTimeout(()=>{qi++;if(qi<5)showQ();else{log("5問の歴史修行を終えた！");completeAction(false,"home")}},750)}
function startBattle(){
 let es=mode==="world"?[["盗賊団","🏴",90,12,6,40],["傭兵隊長","🪖",125,15,8,60],["騎士隊","🛡️",155,17,10,85]]:[["野盗","👹",78,10,5,35],["山賊頭","🧟",115,13,7,55],["甲冑武者","🥷",150,16,9,85]];
 let e=es[Math.floor(Math.random()*es.length)],scale=1+S.threat+S.actions*.008+S.lv*.045;
 enemy={name:e[0],emoji:e[1],hp:Math.round(e[2]*scale),max:Math.round(e[2]*scale),atk:Math.round(e[3]*scale),def:Math.round(e[4]*(1+S.threat*.55)),exp:Math.round(e[5]*scale)};
 guarding=false;document.getElementById("battleLog").innerHTML="";go("battle");battleMsg("⚔️ "+enemy.name+"が現れた！ 脅威 "+Math.round(S.threat*100)+"%");document.querySelector(".enemy").classList.add("flash")}
function battleMsg(x){let b=document.getElementById("battleLog");b.innerHTML+="・"+x+"<br>";b.scrollTop=b.scrollHeight;renderBattle()}
function renderBattle(){if(!enemy)return;document.getElementById("enemyName").textContent=enemy.name;document.getElementById("enemyEmoji").textContent=enemy.emoji;document.getElementById("enemyHp").textContent=Math.max(0,enemy.hp);document.getElementById("enemyMax").textContent=enemy.max;document.getElementById("enemyBar").style.width=Math.max(0,enemy.hp/enemy.max*100)+"%";document.getElementById("enemyAtk").textContent=enemy.atk;document.getElementById("enemyDef").textContent=enemy.def;document.getElementById("enemyThreat").textContent=Math.round(S.threat*100)+"%";document.getElementById("playerHp").textContent=Math.max(0,S.hp);document.getElementById("playerMax").textContent=S.maxHp;document.getElementById("playerBar").style.width=Math.max(0,S.hp/S.maxHp*100)+"%";document.querySelector("#battle .grid button:nth-child(3)").textContent="🔥 必殺技 ("+S.skillUses+"/"+S.maxSkill+")"}
function enemyTurn(){if(!enemy||enemy.hp<=0)return;let dmg=Math.max(2,enemy.atk-S.def+Math.floor(Math.random()*6));if(guarding)dmg=Math.ceil(dmg*.4);S.hp-=dmg;guarding=false;showEffect("💥 "+dmg+" ダメージ");battleMsg(enemy.name+"の攻撃！ "+dmg+"ダメージ。");document.querySelector(".enemy").classList.add("shake");if(S.hp<=0){S.hp=0;battleMsg("💀 HPが0になった……。");setTimeout(gameOver,700)}}
function attack(){if(!enemy)return;let dmg=Math.max(3,S.atk-enemy.def+Math.floor(Math.random()*8));enemy.hp-=dmg;document.querySelector(".enemy").classList.remove("hit");void document.querySelector(".enemy").offsetWidth;document.querySelector(".enemy").classList.add("hit");showEffect("⚔️ "+dmg+" ダメージ");battleMsg("⚔️ 攻撃！ "+dmg+"ダメージ。");if(enemy.hp<=0)return winBattle();setTimeout(enemyTurn,400)}
function guard(){guarding=true;battleMsg("🛡️ 防御！ 次の攻撃を大幅軽減。");setTimeout(enemyTurn,400)}
function battleSkill(){if(!enemy||S.skillUses<=0){battleMsg("必殺技の使用回数がない！");return}S.skillUses--;let dmg=Math.max(10,Math.round(S.atk*2.05-enemy.def+Math.random()*10));enemy.hp-=dmg;document.querySelector(".enemy").classList.remove("hit");void document.querySelector(".enemy").offsetWidth;document.querySelector(".enemy").classList.add("hit");showEffect("🔥 "+dmg+" ダメージ！");battleMsg("🔥 必殺技！ "+dmg+"ダメージ！ 残り "+S.skillUses+"回");if(enemy.hp<=0)return winBattle();setTimeout(enemyTurn,400)}
function runAway(){log("戦闘から逃げた。");enemy=null;completeAction(false,"home")}
function winBattle(){let reward=enemy.exp+S.lv*10;log("🏆 "+enemy.name+"を撃破！");addExp(reward);S.gold+=Math.floor(reward*.7);S.threat=Math.max(0,S.threat-.08);enemy=null;completeAction(false,"home");setTimeout(()=>showModal("勝利！","敵を倒した！<br>必殺技は使用回数を消費します。<br>宿場で回復できます。",[{t:"戻る",f:closeModal}]),300)}
function showModal(t,x,buttons=[{t:"閉じる",f:closeModal}]){document.getElementById("modalTitle").textContent=t;document.getElementById("modalText").innerHTML=x;let box=document.getElementById("modalButtons");box.innerHTML="";buttons.forEach(b=>{let btn=document.createElement("button");btn.textContent=b.t;btn.onclick=b.f;box.appendChild(btn)});document.getElementById("modal").classList.add("show")}
function closeModal(){
 document.getElementById("modal").classList.remove("show");
}
function markPlace(el){if(!el)return;el.classList.remove('pressed');void el.offsetWidth;el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),500)}
function placeChoice(title,text,yesText,yesFn){
 showModal(title,text,[
  {t:yesText,f:()=>{document.getElementById("modal").classList.remove("show");yesFn();completeAction(false,"map");}},
  {t:"行動しない",f:()=>{document.getElementById("modal").classList.remove("show");showEffect("↩️ 行動しなかった");go("map");}}
 ]);
}
function eventTown(el){
 markPlace(el);showEffect('🏯 城へ');
 placeChoice("🏯 尾張の城","この場所で行動しますか？<br><br>武将を支援すると力を得られるが、戦争の緊張も高まる。","行動する",()=>{
  showModal("🏯 尾張の城：行動","武将を支援した！<br><br>攻撃 +2、脅威 +10%。");
  S.atk+=2;S.threat=Math.min(2.5,S.threat+.10);log("攻撃 +2。脅威 +10%。");
  setTimeout(()=>{if(document.getElementById("modal").classList.contains("show"))closeModal()},500);
 });
}
function eventVillage(el){
 markPlace(el);showEffect('🏘️ 村へ');
 showModal("🏘️ 村","この場所で行動しますか？<br><br>行動すると、次の行動内容を選べます。",[
  {t:"行動する",f:()=>{showModal("🏘️ 村で何をする？","",[
   {t:"村を手伝う（+25両 / HP -12）",f:()=>{closeModal();S.gold+=25;S.hp=Math.max(0,S.hp-12);log("25両獲得、HP -12。");if(S.hp===0){gameOver();return}completeAction(false,"map");}},
   {t:"村を説得（EXP+25 / 脅威+8%）",f:()=>{closeModal();addExp(25);S.threat=Math.min(2.5,S.threat+.08);log("EXP +25、脅威 +8%。");completeAction(false,"map");}},
   {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
  ])}},
  {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
 ]);
}
function eventShrine(el){
 markPlace(el);showEffect('✨ 神社');
 placeChoice("⛩️ 神社","この場所で休みますか？<br><br>休むとHPが回復します。","行動する",()=>{
  let n=18;S.hp=Math.min(S.maxHp,S.hp+n);showEffect("✨ HP +"+n);log("神社で休み、HP +"+n+"。");
 });
}
function eventTrader(el){
 markPlace(el);showEffect('🔥 商人');
 showModal("🧺 商人","この場所で行動しますか？<br><br>必殺技の使用回数だけを回復できます。",[
  {t:"行動する",f:()=>{showModal("🧺 商人で何をする？","",[
   {t:"15両：必殺技 +1回",f:()=>{if(S.gold<15){log("両が足りない。");return}closeModal();S.gold-=15;S.skillUses=Math.min(S.maxSkill,S.skillUses+1);showEffect("🔥 必殺技 +1回");log("必殺技 +1回（15両）。");completeAction(false,"map");}},
   {t:"30両：必殺技 +2回",f:()=>{if(S.gold<30){log("両が足りない。");return}closeModal();S.gold-=30;S.skillUses=Math.min(S.maxSkill,S.skillUses+2);showEffect("🔥 必殺技 +2回");log("必殺技 +2回（30両）。");completeAction(false,"map");}},
   {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
  ])}},
  {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
 ]);
}
function eventInn(el){
 markPlace(el);showEffect('💚 宿場');
 showModal("🏮 宿場","この場所で行動しますか？<br><br>お金を支払ってHPだけを回復できます。",[
  {t:"行動する",f:()=>{showModal("🏮 宿場で何をする？","",[
   {t:"10両：HP +20",f:()=>{if(S.gold<10){log("両が足りない。");return}closeModal();S.gold-=10;S.hp=Math.min(S.maxHp,S.hp+20);showEffect("💚 HP +20");log("HP +20（10両）。");completeAction(false,"map");}},
   {t:"20両：HP +40",f:()=>{if(S.gold<20){log("両が足りない。");return}closeModal();S.gold-=20;S.hp=Math.min(S.maxHp,S.hp+40);showEffect("💚 HP +40");log("HP +40（20両）。");completeAction(false,"map");}},
   {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
  ])}},
  {t:"行動しない",f:()=>{closeModal();showEffect("↩️ 行動しなかった");go("map");}}
 ]);
}

function gameOver(){
 document.getElementById("modalTitle").textContent="💀 GAME OVER";
 document.getElementById("modalText").innerHTML="HPが0になりました。<br><br>セーブ済みデータがある場合は、そこから復帰できます。";
 const box=document.getElementById("modalButtons");box.innerHTML="";
 let a=document.createElement("button");a.textContent="最初からやり直す";a.onclick=()=>{document.getElementById("modal").classList.remove("show");resetWithoutConfirm()};box.appendChild(a);
 let b=document.createElement("button");b.textContent="セーブから復帰";b.onclick=()=>{document.getElementById("modal").classList.remove("show");if(!loadGame(false))resetWithoutConfirm();else go("home")};box.appendChild(b);
 document.getElementById("modal").classList.add("show");
}
function resetWithoutConfirm(){S={mode:"japan",lv:1,exp:0,hp:100,atk:10,def:8,maxHp:100,gold:50,actions:0,eventStep:3,threat:0,eventCount:0,skillUses:3,maxSkill:3,seen:[]};mode="japan";logs=[];go("home");log("🔄 新しいゲームを開始しました。セーブデータは残っています。")}
function forcedUprising(){showModal("🚩 強制イベント：一揆","領内で農民が一斉に立ち上がった！",[{t:"鎮圧する",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"要求を聞く（脅威-18%）",f:()=>{S.threat=Math.max(0,S.threat-.18);log("一揆勢と交渉した。");closeModal()}}])}
function forcedRebellion(){showModal("🔥 強制イベント：反乱","兵士が反旗を翻した！",[{t:"戦う（攻撃+1）",f:()=>{S.atk++;closeModal();setTimeout(startBattle,100)}},{t:"守りを固める（防御+3）",f:()=>{S.def+=3;log("防御 +3。");closeModal()}}])}
function forcedDisaster(){let dmg=12;S.hp=Math.max(1,S.hp-dmg);S.gold=Math.max(0,S.gold-8);showModal("🌪️ 強制イベント：自然災害","大雨と土砂崩れが領内を襲った。<br><br>HP -12、8両を失った。")}
function forcedWar(){showModal("⚔️ 強制イベント：戦","隣国との戦が始まった。",[{t:"戦場へ向かう",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"兵站を支える（25両・防御+1）",f:()=>{S.gold+=25;S.def++;log("兵站を整えた。");closeModal()}}])}
function forcedRaid(){showModal("🏴 強制イベント：襲撃","夜襲だ！敵が村を襲っている。",[{t:"救援に向かう",f:()=>{closeModal();setTimeout(startBattle,100)}},{t:"村を守る（防御+2・15両）",f:()=>{S.def+=2;S.gold=Math.max(0,S.gold-15);log("村を守った。");closeModal()}}])}

// 古いlocalStorageの自動復元はしない。ページを開くたび新規開始。
// 「リンクを閉じる度にリセット」＝メモリ上のゲーム状態は保持しない。
// 明示セーブは別キーに保存され、リセット後でも「セーブから復帰」で戻せる。
window.addEventListener("pagehide",()=>{enemy=null;qList=[];qi=0});
render();
</script>
</body>
</html>
